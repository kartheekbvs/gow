<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyDocs Dojo — Practice Notebooks with HackerRank-grade exercises</title>
  <meta name="description" content="The PyDocs Dojo: a reasoning-first practice gym for the whole Python & Data Science curriculum. 6 tracks, 36 notebooks, 141 exercises with visible and hidden tests, efficiency budgets, progressive hints and editorials — all graded by a real Python (Pyodide) running in your browser.">
  <link rel="stylesheet" href="style.css">
  <script src="shared.js" defer></script>
  <style>
    /* ═══════════════════════ PyDocs Dojo ═══════════════════════ */

    .dojo-bar {
      position: sticky; top: var(--header-height); z-index: 40;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      background: rgba(13,17,23,0.92); backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle); border-radius: 12px;
      padding: 0.55rem 0.9rem; margin-bottom: 1.5rem;
    }
    .dojo-bar-left { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .dojo-crumb { color: var(--accent-blue); text-decoration: none; font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
    .dojo-crumb:hover { text-decoration: underline; }
    .dojo-crumb-sep { color: var(--text-muted); }
    .dojo-crumb-here { color: var(--text-secondary); font-size: 0.9rem; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dojo-bar-right { display: flex; align-items: center; gap: 0.75rem; }
    .engine-pill { font-size: 0.78rem; font-weight: 600; padding: 0.25rem 0.6rem;
      border-radius: 999px; border: 1px solid var(--border-subtle); white-space: nowrap; }
    .eng-idle { color: var(--text-muted); }
    .eng-booting { color: var(--accent-yellow); border-color: rgba(227,179,65,0.4); }
    .eng-ready { color: var(--accent-green); border-color: rgba(63,185,80,0.4); }
    .eng-error { color: var(--accent-red); border-color: rgba(248,81,73,0.4); }
    .dojo-xp { font-size: 0.85rem; color: var(--accent-yellow); font-weight: 600; white-space: nowrap; }
    .dojo-xp b { font-size: 1rem; }

    /* ── Hero ── */
    .dojo-hero h1 { font-size: 2.2rem; }
    .dojo-grad { background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .dojo-hero-stats { display: flex; gap: 1.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .dhs { display: flex; flex-direction: column; }
    .dhs b { font-size: 1.6rem; font-weight: 900; font-family: 'Outfit', sans-serif; color: var(--accent-blue); }
    .dhs span { font-size: 0.78rem; color: var(--text-muted); }
    .dojo-progress-wrap { margin-top: 1.25rem; }
    .dojo-progress { height: 8px; border-radius: 999px; background: var(--bg-hover);
      border: 1px solid var(--border-subtle); overflow: hidden; }
    .dojo-progress.slim { height: 5px; flex: 1; }
    .dojo-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
      border-radius: 999px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
    .dojo-progress-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem; }
    .dojo-hero-actions { margin-top: 1.25rem; }
    .dojo-hero-track { background: var(--bg-card); border-radius: 12px; }

    .dojo-h2 { font-size: 1.4rem; font-weight: 800; color: var(--text-primary); margin: 2.25rem 0 1.25rem; }
    .dojo-grid { margin-bottom: 1.5rem; }
    .dojo-track-progress { display: flex; align-items: center; gap: 0.6rem; margin: 0.75rem 0 0.6rem; }
    .dojo-track-pcount { font-size: 0.75rem; color: var(--text-muted); font-family: 'Fira Code', monospace; white-space: nowrap; }
    .dojo-how { margin-top: 2rem; }

    /* ── Track view: notebook cards ── */
    .dojo-nb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
    .dojo-nb-card { display: flex; align-items: center; gap: 1rem; text-decoration: none;
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px;
      padding: 1.1rem 1.2rem; transition: var(--transition); position: relative; }
    .dojo-nb-card:hover { transform: translateY(-2px); border-color: var(--accent-blue);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35); background: var(--bg-hover); }
    .dojo-nb-card.done { border-color: rgba(63,185,80,0.45); }
    .dojo-nb-num { width: 2.1rem; height: 2.1rem; border-radius: 8px; color: var(--text-inverse);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; flex-shrink: 0; }
    .dojo-nb-main { flex: 1; min-width: 0; }
    .dojo-nb-title { font-weight: 700; color: var(--text-primary); font-size: 0.98rem; margin-bottom: 0.25rem; }
    .dojo-done-badge { font-size: 0.7rem; color: var(--accent-green); background: rgba(63,185,80,0.12);
      border: 1px solid rgba(63,185,80,0.3); padding: 0.1rem 0.45rem; border-radius: 999px; vertical-align: middle; }
    .dojo-nb-blurb { font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; margin-bottom: 0.5rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .dojo-nb-meta { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .dojo-nb-go { color: var(--text-muted); font-size: 1.2rem; transition: var(--transition); }
    .dojo-nb-card:hover .dojo-nb-go { color: var(--accent-blue); transform: translateX(3px); }

    .dojo-lv { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.15rem 0.5rem; border-radius: 999px; }
    .lv-beginner { color: var(--accent-green); background: rgba(63,185,80,0.12); border: 1px solid rgba(63,185,80,0.3); }
    .lv-intermediate { color: var(--accent-yellow); background: rgba(227,179,65,0.1); border: 1px solid rgba(227,179,65,0.3); }
    .lv-advanced { color: var(--accent-red); background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); }
    .dojo-lv-ex { font-size: 0.75rem; color: var(--text-muted); font-family: 'Fira Code', monospace; }

    /* ── Notebook head ── */
    .dojo-nb-head { background: linear-gradient(180deg, rgba(88,166,255,0.06), transparent);
      border-left: 4px solid var(--nb-accent, var(--accent-blue));
      padding: 1.75rem 1.75rem 1.5rem; border-radius: 12px; margin-bottom: 1.75rem; }
    .dojo-nb-head h1 { font-size: 1.7rem; }
    .dojo-nb-head .subtitle { margin-top: 0.5rem; }
    .dojo-nb-head-meta { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; margin-top: 1rem; }
    .dojo-ref-link { color: var(--accent-blue); font-size: 0.85rem; font-weight: 600; text-decoration: none; }
    .dojo-ref-link:hover { text-decoration: underline; }

    /* ── Cells ── */
    .dojo-cells { display: flex; flex-direction: column; gap: 1.4rem; }
    .dojo-cell { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px;
      padding: 1.4rem 1.6rem; position: relative; overflow: hidden; }
    .dojo-cell.dojo-concept { border-left: 4px solid var(--accent-blue); }
    .dojo-cell.dojo-exercise { border-left: 4px solid var(--accent-orange); }
    .dojo-cell-head { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .dojo-cell-kind { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.09em; padding: 0.2rem 0.55rem;
      border-radius: 6px; text-transform: uppercase; }
    .dojo-cell-kind.concept { color: var(--accent-blue); background: rgba(88,166,255,0.12); border: 1px solid rgba(88,166,255,0.3); }
    .dojo-cell-kind.exercise { color: var(--accent-orange); background: rgba(240,136,62,0.12); border: 1px solid rgba(240,136,62,0.3); }
    .dojo-cell-kind.predict { color: var(--accent-purple); background: rgba(188,140,255,0.12); border: 1px solid rgba(188,140,255,0.3); }
    .dojo-cell-title { font-weight: 800; font-size: 1.05rem; color: var(--text-primary); flex: 1; min-width: 200px; }
    .dojo-diff { font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 999px; text-transform: uppercase; }
    .dojo-diff.d-easy { color: var(--accent-green); background: rgba(63,185,80,0.12); border: 1px solid rgba(63,185,80,0.3); }
    .dojo-diff.d-medium { color: var(--accent-yellow); background: rgba(227,179,65,0.1); border: 1px solid rgba(227,179,65,0.3); }
    .dojo-diff.d-hard { color: var(--accent-red); background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); }
    .dojo-xp-chip { font-size: 0.72rem; font-weight: 800; color: var(--text-muted);
      border: 1px dashed var(--border-subtle); padding: 0.15rem 0.5rem; border-radius: 999px; }
    .dojo-xp-chip.earned { color: var(--accent-green); border: 1px solid rgba(63,185,80,0.4);
      background: rgba(63,185,80,0.1); border-style: solid; }

    .dojo-concept-body { color: var(--text-secondary); line-height: 1.65; font-size: 0.95rem; }
    .dojo-concept-body p { margin-bottom: 0.8rem; }
    .dojo-concept-body p:last-child { margin-bottom: 0; }
    .dojo-concept-body code, .dojo-ex-body code, .dojo-solution-reason code, .dojo-predict-explain code,
    .dojo-hint code { background: rgba(110,118,129,0.2); border-radius: 4px; padding: 0.1rem 0.35rem;
      font-family: 'Fira Code', monospace; font-size: 0.85em; color: var(--text-primary); }
    .dojo-concept-body b, .dojo-ex-body b { color: var(--text-primary); }

    /* ── Demo / code blocks ── */
    .dojo-demo, .dojo-editor-zone { margin-top: 1rem; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border-subtle); background: var(--code-bg); }
    .dojo-demo-bar, .dojo-editor-bar { display: flex; justify-content: space-between; align-items: center;
      padding: 0.45rem 0.8rem; background: var(--bg-hover); border-bottom: 1px solid var(--border-subtle); }
    .dojo-demo-lang { font-size: 0.72rem; color: var(--text-muted); font-family: 'Fira Code', monospace; }
    .dojo-run-btn { background: var(--accent-green); color: var(--text-inverse); border: none;
      font-weight: 700; font-size: 0.78rem; padding: 0.3rem 0.9rem; border-radius: 6px; cursor: pointer;
      transition: var(--transition); }
    .dojo-run-btn:hover { filter: brightness(1.15); }
    .dojo-run-btn:disabled { opacity: 0.6; cursor: wait; }
    .dojo-demo-code, .dojo-predict-code { margin: 0; padding: 0.9rem 1rem; overflow-x: auto;
      font-family: 'Fira Code', monospace; font-size: 0.85rem; line-height: 1.6; color: var(--text-primary); }
    .dojo-demo-out { padding: 0.7rem 1rem; font-family: 'Fira Code', monospace; font-size: 0.82rem;
      line-height: 1.55; white-space: pre-wrap; border-top: 1px solid var(--border-subtle); }
    .dojo-demo-out.running { color: var(--accent-yellow); }
    .dojo-demo-out.ok { color: #aff3bc; }
    .dojo-demo-out.err { color: var(--accent-red); }

    .dojo-draft-state { font-size: 0.7rem; color: var(--accent-green); font-family: 'Fira Code', monospace; }
    .dojo-editor { display: block; width: 100%; border: none; outline: none; resize: none;
      background: var(--code-bg); color: var(--text-primary); caret-color: var(--accent-blue);
      font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 0.88rem; line-height: 1.55;
      padding: 0.9rem 1rem; tab-size: 4; white-space: pre; overflow-x: auto; }
    .dojo-editor:focus { background: #131920; }

    /* ── Actions ── */
    .dojo-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.9rem; }
    .dojo-btn { display: inline-flex; align-items: center; gap: 0.4rem; border-radius: 8px;
      font-weight: 700; font-size: 0.85rem; padding: 0.5rem 1rem; cursor: pointer; text-decoration: none;
      transition: var(--transition); border: 1px solid transparent; }
    .dojo-btn kbd { font-size: 0.68rem; background: rgba(255,255,255,0.14); border-radius: 4px;
      padding: 0.05rem 0.3rem; font-family: 'Fira Code', monospace; }
    .dojo-btn-primary { background: var(--accent-blue); color: var(--text-inverse); }
    .dojo-btn-primary:hover { filter: brightness(1.15); }
    .dojo-btn-primary:disabled { opacity: 0.65; cursor: wait; }
    .dojo-btn-ghost { background: transparent; color: var(--text-secondary); border-color: var(--border-subtle); }
    .dojo-btn-ghost:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .dojo-btn-ghost:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Exercise body ── */
    .dojo-ex-body { color: var(--text-secondary); line-height: 1.65; font-size: 0.95rem; }
    .dojo-ex-body p { margin-bottom: 0.8rem; }
    .dojo-ex-body p:last-child { margin-bottom: 0; }
    .dojo-constraints { margin: 0.9rem 0 0; padding: 0; list-style: none;
      display: flex; flex-direction: column; gap: 0.3rem; }
    .dojo-constraints li { font-size: 0.8rem; color: var(--text-muted); }
    .dojo-constraints code { background: rgba(110,118,129,0.18); border-radius: 4px; padding: 0.08rem 0.3rem; }
    .dojo-examples { margin-top: 1rem; border: 1px dashed var(--border-subtle); border-radius: 10px;
      padding: 0.8rem 1rem; background: rgba(110,118,129,0.05); }
    .dojo-examples-title { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.6rem; }
    .dojo-example { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; padding: 0.3rem 0;
      border-bottom: 1px solid var(--border-subtle); }
    .dojo-example:last-child { border-bottom: none; }
    .dojo-example-call, .dojo-example-ret { font-family: 'Fira Code', monospace; font-size: 0.8rem; }
    .dojo-example-call { color: var(--code-string); }
    .dojo-example-arrow { color: var(--text-muted); }
    .dojo-example-ret { color: var(--accent-green); font-weight: 600; }
    .dojo-example-why { font-size: 0.78rem; color: var(--text-muted); flex-basis: 100%; }
    .dojo-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.9rem; }

    /* ── Hints ── */
    .dojo-hints { margin-top: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .dojo-hint { background: rgba(227,179,65,0.06); border: 1px solid rgba(227,179,65,0.25);
      border-radius: 8px; padding: 0.6rem 0.9rem; font-size: 0.87rem; color: var(--text-secondary);
      line-height: 1.55; }
    .dojo-hint-n { font-weight: 800; color: var(--accent-yellow); font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.06em; margin-right: 0.5rem; }

    /* ── Test results ── */
    .dojo-results { margin-top: 1rem; border: 1px solid var(--border-subtle); border-radius: 10px; overflow: hidden; }
    .dojo-results-summary { padding: 0.65rem 1rem; font-size: 0.9rem; font-weight: 700; }
    .dojo-results-summary.pass { background: rgba(63,185,80,0.1); color: var(--accent-green); }
    .dojo-results-summary.fail { background: rgba(248,81,73,0.08); color: var(--accent-red); }
    .dojo-results-summary.running { background: rgba(227,179,65,0.08); color: var(--accent-yellow); }
    .dojo-t { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
      padding: 0.5rem 1rem; border-top: 1px solid var(--border-subtle); font-size: 0.85rem; }
    .dojo-t.pass .dojo-t-ico { color: var(--accent-green); }
    .dojo-t.fail .dojo-t-ico { color: var(--accent-red); }
    .dojo-t.fail .dojo-t-label { color: var(--text-primary); }
    .dojo-t.pass { background: rgba(63,185,80,0.03); }
    .dojo-t.fail { background: rgba(248,81,73,0.04); }
    .dojo-t-ico { font-weight: 900; width: 1rem; }
    .dojo-t-label { color: var(--text-secondary); }
    .dojo-t-hidden { font-size: 0.66rem; color: var(--accent-purple); border: 1px solid rgba(188,140,255,0.35);
      border-radius: 999px; padding: 0.05rem 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .dojo-t-ops { font-family: 'Fira Code', monospace; font-size: 0.72rem; color: var(--accent-green);
      margin-left: auto; }
    .dojo-t-ops.over { color: var(--accent-red); font-weight: 700; }
    .dojo-t-detail { flex-basis: 100%; background: var(--bg-base); border-radius: 8px; padding: 0.6rem 0.8rem;
      display: flex; flex-direction: column; gap: 0.35rem; }
    .dojo-t-row { display: flex; gap: 0.8rem; font-size: 0.8rem; align-items: baseline; }
    .dojo-t-row span { color: var(--text-muted); min-width: 4.2rem; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.05em; }
    .dojo-t-row code { font-family: 'Fira Code', monospace; color: var(--text-primary);
      white-space: pre-wrap; word-break: break-all; }
    .dojo-t-row code.t-exp { color: var(--accent-green); }
    .dojo-t-row code.t-got { color: var(--accent-red); }
    .dojo-t-err, .dojo-t-out, .dojo-stderr, .dojo-stdout { margin: 0; background: var(--bg-base);
      border-radius: 8px; padding: 0.55rem 0.8rem; font-family: 'Fira Code', monospace;
      font-size: 0.76rem; line-height: 1.5; overflow-x: auto; white-space: pre-wrap; }
    .dojo-t-err, .dojo-stderr { color: var(--accent-red); }
    .dojo-t-out, .dojo-stdout { color: var(--text-secondary); }
    .dojo-stderr, .dojo-stdout { margin: 0.6rem 1rem 0.8rem; }

    /* ── Solution ── */
    .dojo-solution { margin-top: 1rem; border: 1px solid rgba(188,140,255,0.3); border-radius: 10px; overflow: hidden; }
    .dojo-solution-bar { padding: 0.45rem 1rem; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent-purple); background: rgba(188,140,255,0.08);
      border-bottom: 1px solid rgba(188,140,255,0.25); }
    .dojo-solution-reason { padding: 0.9rem 1.1rem; color: var(--text-secondary); line-height: 1.65; font-size: 0.9rem; }
    .dojo-solution-reason p { margin-bottom: 0.7rem; }
    .dojo-solution-reason p:last-child { margin-bottom: 0; }
    .dojo-solution-code { margin: 0; padding: 0.9rem 1.1rem; background: var(--code-bg);
      border-top: 1px solid var(--border-subtle); overflow-x: auto; font-family: 'Fira Code', monospace;
      font-size: 0.85rem; line-height: 1.6; color: var(--text-primary); }

    /* ── Predict mode ── */
    .dojo-predict-code { border: 1px solid var(--border-subtle); border-radius: 10px; background: var(--code-bg);
      margin-top: 1rem; }
    .dojo-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.6rem; margin-top: 1rem; }
    .dojo-option { display: flex; align-items: center; gap: 0.7rem; text-align: left;
      background: var(--bg-hover); border: 1px solid var(--border-subtle); border-radius: 10px;
      padding: 0.7rem 0.9rem; cursor: pointer; transition: var(--transition); color: var(--text-primary);
      font-size: 0.88rem; line-height: 1.4; }
    .dojo-option:hover:not(:disabled) { border-color: var(--accent-blue); transform: translateY(-1px); }
    .dojo-option.picked { border-color: var(--accent-blue); background: rgba(88,166,255,0.08); }
    .dojo-option.correct { border-color: var(--accent-green); background: rgba(63,185,80,0.1); }
    .dojo-option.wrong { border-color: var(--accent-red); background: rgba(248,81,73,0.08); }
    .dojo-option:disabled { cursor: default; opacity: 0.9; }
    .dojo-opt-letter { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.78rem;
      flex-shrink: 0; color: var(--text-secondary); }
    .dojo-option.correct .dojo-opt-letter { color: var(--accent-green); border-color: var(--accent-green); }
    .dojo-option.wrong .dojo-opt-letter { color: var(--accent-red); border-color: var(--accent-red); }
    .dojo-predict-feedback { margin-top: 1rem; border-radius: 10px; padding: 0.9rem 1.1rem; font-size: 0.9rem; }
    .dojo-predict-feedback.ok { background: rgba(63,185,80,0.07); border: 1px solid rgba(63,185,80,0.3); }
    .dojo-predict-feedback.ok b { color: var(--accent-green); }
    .dojo-predict-feedback.bad { background: rgba(248,81,73,0.06); border: 1px solid rgba(248,81,73,0.3); }
    .dojo-predict-feedback.bad b { color: var(--accent-red); }
    .dojo-predict-explain { margin-top: 0.6rem; color: var(--text-secondary); line-height: 1.6; }
    .dojo-predict-explain p { margin-bottom: 0.6rem; }
    .dojo-predict-explain p:last-child { margin-bottom: 0; }

    /* ── Notebook nav ── */
    .dojo-nb-nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }

    /* ── Confetti ── */
    .dojo-confetti { position: absolute; top: 0; width: 8px; height: 12px; border-radius: 2px;
      pointer-events: none; z-index: 5; animation: dojo-confetti-fall 1.4s cubic-bezier(0.2,0.6,0.4,1) forwards; }
    @keyframes dojo-confetti-fall {
      0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
